# Personal capital-market research pipeline — configuration.
# Secrets live in .env, never here.

paths:
  cache: cache
  logs: logs

data:
  # "lse" (London Strategic Edge) or "yfinance_fred"
  provider: lse
  # Used only if the primary provider cannot be constructed (e.g. missing key).
  # Set to null to make a missing primary a hard failure instead.
  fallback_provider: yfinance_fred

  ohlcv_timeframe: "1d"
  ohlcv_lookback_days: 730

  # LSE's own daily bar covers 04:00-20:00 New York: its close is the last
  # after-hours trade and its volume includes pre-market and after-hours
  # (checked with run.py --discover-session). "regular" rebuilds each day from
  # 30-minute candles, 09:30-16:00 (13:00 on half-days) — the definition
  # TradingView and most sources use. "extended" keeps LSE's bar.
  daily_session: regular

  # The newest bar must be no older than this, or the stage fails.
  # This is the guard against lse-data's order="asc" default silently handing
  # back the START of history (US equities go back to 2003).
  max_staleness_days: 5

  # A bar fetched while the exchange is open is not a close — its volume covers
  # part of the day. Drop today's bar until session_close (exchange local time,
  # set a little after the official 16:00 so the closing auction has printed).
  drop_incomplete_session: true
  market_timezone: "America/New_York"
  session_close: "16:15"

  fetch_options: true
  options_max_dte: 90

  fetch_macro: true
  # Series codes. Search with `python run.py --discover-macro cpi`.
  # usacsa = US CPI, seasonally adjusted, index points — the same definition as
  # FRED CPIAUCSL, which the yfinance_fred fallback uses, so the series means the
  # same thing whichever provider runs. Alternatives: unitedstaconpriindcp (not
  # seasonally adjusted), cpi_yoy (inflation rate, %).
  cpi_series: "usacsa"
  yield_series: "US10Y"

  # Each macro series must be recent for its frequency, in calendar days. The
  # monthly limit is generous because CPI for a month is published about two
  # weeks after the month ends. A stale series is replaced by its FRED copy
  # (CPIAUCSL / DGS10) when that copy is fresher; set macro_fallback: null to
  # only warn instead.
  macro_max_age_daily: 7
  macro_max_age_monthly: 75
  macro_fallback: fred

  # Save market cap (LSE fundamentals) and next earnings date (Yahoo calendar) to
  # data_reference.json for stage 2 to cross-check.
  fetch_reference: true

validate:
  # Second source for the cross-check: TradingView's official MCP server
  # (OAuth 2.1, needs a paid TradingView plan). Sign in once with:
  #   python run.py --auth-tradingview
  provider: tradingview_mcp
  close_tolerance_pct: 0.5
  market_cap_tolerance_pct: 2.0
  earnings_tolerance_days: 1

  tradingview_url: "https://mcp.tradingview.com/mcp"
  # Holds a refresh token — kept in your user folder, outside the project.
  tradingview_token_path: "~/.mrp/tv_tokens.json"
  # Where the browser is sent back after sign-in. The port must stay fixed: it
  # is registered with TradingView on the first sign-in. Sign in on
  # tradingview.com first: TradingView's CDN blocks its sign-in page when that
  # page is reached as a redirect from the approval URL.
  tradingview_callback_host: "localhost"
  tradingview_callback_port: 8765

  # TradingView names symbols EXCHANGE:TICKER. Tickers not listed below get
  # tradingview_exchange as their prefix (NVDA -> NASDAQ:NVDA).
  tradingview_exchange: "NASDAQ"
  tradingview_symbols: {}
  # Seconds to wait between retries when TradingView answers 429 (rate limit).
  rate_limit_delays: [5, 15, 45]

  # Every check must pass. A check that cannot run (rate limit, sign-in needed,
  # missing reference value) counts as "unverifiable" and halts the run too.

# Stages that need their own interpreter (phase 4: PixelRAG needs an isolated
# venv). Empty means "use the current interpreter".
venvs: {}
